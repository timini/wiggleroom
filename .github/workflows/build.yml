name: Build Plugin
on:
  push:
    branches: [main, "release/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  SDK_VERSION: 2.6.6
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: lin-x64
          - os: macos-15-intel
            platform: mac-x64
          - os: macos-15
            platform: mac-arm64
          - os: windows-2022
            platform: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq zstd libglu1-mesa libx11-6 libasound2 libjack-jackd2-0 xvfb libgl1-mesa-dri
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install jq zstd
      - name: Windows dependencies
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc make jq zstd unzip curl python
      - name: Build and verify (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          curl -fLsS "https://vcvrack.com/downloads/Rack-SDK-${SDK_VERSION}-${{ matrix.platform }}.zip" -o sdk.zip
          unzip -q sdk.zip
          export RACK_DIR="$PWD/Rack-SDK"
          make -j2 dist
          python3 scripts/verify_release_package.py dist/*.vcvplugin '${{ matrix.platform }}'
          scripts/test_acid_release.sh
      - name: Build and verify (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          curl -fLsS "https://vcvrack.com/downloads/Rack-SDK-${SDK_VERSION}-win-x64.zip" -o sdk.zip
          unzip -q sdk.zip
          export RACK_DIR="$PWD/Rack-SDK"
          make -j2 dist
          python scripts/verify_release_package.py dist/*.vcvplugin win-x64
      - name: Load package and render real Rack panel (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fLsS https://vcvrack.com/downloads/RackFree-2.6.6-lin-x64.zip -o rack.zip
          unzip -q rack.zip -d build/rack-app
          mkdir -p build/rack-user/plugins-lin-x64
          cp dist/*.vcvplugin build/rack-user/plugins-lin-x64/
          xvfb-run -a timeout 90 build/rack-app/Rack2Free/Rack -s "$PWD/build/rack-app/Rack2Free" -u "$PWD/build/rack-user" -t 2
          test -s build/rack-user/screenshots/WiggleRoom/ACID9Voice.png
          timeout 10 build/rack-app/Rack2Free/Rack -s "$PWD/build/rack-app/Rack2Free" -u "$PWD/build/rack-user" -h "$PWD/examples/ACID9-first-sound.vcv" || test "$?" = 124
          ! grep -Ei 'fatal|could not find module|failed to load' build/rack-user/log.txt
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: Rack-smoke-evidence
          path: |
            build/rack-user/screenshots/WiggleRoom/*.png
            build/rack-user/log.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WiggleRoom-${{ matrix.platform }}
          path: dist/*.vcvplugin
          if-no-files-found: error
